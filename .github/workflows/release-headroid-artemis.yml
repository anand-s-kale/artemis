# Builds and publishes the headroid-artemis and headroid-artemis-client
# distributions. Publishing happens only for pushed tags named
# headroid-artemis-v<version>; branch pushes and workflow_dispatch only build and verify.
name: Release headroid-artemis

on:
  push:
    branches:
      # Build-only: GitHub cannot dispatch a workflow that is absent from the
      # default branch. The pypi job below still requires a tag.
      - headroid-artemis
    tags:
      - "headroid-artemis-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/showcase_ui/package-lock.json

      - name: Build the Showcase UI (setup.py refuses to build without it)
        run: |
          npm ci --prefix apps/showcase_ui
          npm run build --prefix apps/showcase_ui

      - name: Check the tag matches both package versions
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib

          def read(path):
              with open(path, "rb") as handle:
                  project = tomllib.load(handle)["project"]
              return project["name"], project["version"]

          root_name, root_version = read("pyproject.toml")
          client_name, client_version = read("packages/artemis-client/pyproject.toml")
          assert root_name == "headroid-artemis", root_name
          assert client_name == "headroid-artemis-client", client_name
          assert root_version == client_version, (root_version, client_version)
          with open("pyproject.toml", "rb") as handle:
              dependencies = tomllib.load(handle)["project"]["dependencies"]
          pins = [d for d in dependencies if d.replace(" ", "").startswith(client_name + "==")]
          assert pins == [f"{client_name}=={client_version}"], (pins, client_version)
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              tag = os.environ["GITHUB_REF_NAME"]
              assert tag == f"headroid-artemis-v{root_version}", (tag, root_version)
          print(f"Versions OK: {root_version}")
          PY

      - name: Build both wheels
        env:
          USE_CYTHON: "0"
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --wheel --outdir dist-client packages/artemis-client
          python -m build --wheel --outdir dist-root .

      - name: Check metadata
        run: |
          python -m twine check --strict dist-client/* dist-root/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: headroid-artemis-dist
          path: |
            dist-client/
            dist-root/
          if-no-files-found: error

  pypi-client:
    name: Publish headroid-artemis-client to PyPI
    needs: build
    # Never runs for workflow_dispatch or branch pushes: tags only.
    if: startsWith(github.ref, 'refs/tags/headroid-artemis-v')
    runs-on: ubuntu-latest
    # Its own environment: PyPI refuses two pending trusted publishers with the same repository, workflow and
    # environment, so the client's publisher is told apart by this name.
    environment: pypi-client
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: headroid-artemis-dist

      - name: Publish headroid-artemis-client
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-client/
          skip-existing: true

  pypi:
    name: Publish headroid-artemis to PyPI
    needs: pypi-client
    if: startsWith(github.ref, 'refs/tags/headroid-artemis-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: headroid-artemis-dist

      - name: Publish headroid-artemis
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-root/
          skip-existing: true
